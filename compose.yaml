services:
  bridge:
    build: .
    image: ghcr.io/andrelyl/wechat2dot:2.0.0a2
    init: true
    user: "10001:10001"
    restart: unless-stopped
    command: ["run"]
    environment:
      WECHAT2DOT_HOME: /data
    volumes:
      - wechat2dot:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
volumes:
  wechat2dot:
    name: wechat2dot
